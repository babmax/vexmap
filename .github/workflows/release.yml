# A tag `v*`: the region server binary built on Linux (no cross-compiling, audit section 6), the mod bundle for the
# launcher, SHA-256 sums and a minisign signature over them. The secret key is the owner's: repository secret
# MINISIGN_SECRET_KEY (the file from `minisign -G`, base64) and MINISIGN_PASSWORD.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config minisign
      - name: horizon-mixins at the pinned revision
        run: |
          rev=$(python3 -c 'import json; print(json.load(open("mods/vexmap/compatibility.json"))["horizon_mixins_revision"])')
          git clone https://github.com/horizon-rust/horizon-mixins .deps/horizon-mixins
          git -C .deps/horizon-mixins checkout "$rev"
      - run: cargo test --workspace --locked
      - run: python3 tools/dev/stage.py build mods/vexmap --profile release
      - name: Package and sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: python3 tools/release/sign.py --version "${GITHUB_REF_NAME}" --server .deps/target/release/horizon-client --out dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
