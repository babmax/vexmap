# Every push and PR: protocol tests on the three player OSes, and the mod checked inside the pinned Horizon on Linux.
name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  proto:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo fmt --all --check
      - run: rustfmt --edition 2024 --check mods/vexmap/mixins/vexmap/runtime.rs mods/vexmap/mixins/vexmap/map_screen.rs mods/vexmap/mixins/vexmap/render.rs mods/vexmap/mixins/vexmap/hooks/*.rs
        shell: bash
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The same data-core tests on the production database. They wipe its public schema, hence one thread.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo test -p vexmap-core --test core --locked -- --test-threads=1
        env:
          VEXMAP_TEST_POSTGRES_URL: postgres://postgres:ci-only@localhost:5432/postgres

  native:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Horizon build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config
      - name: horizon-mixins at the pinned revision
        run: |
          rev=$(python3 -c 'import json; print(json.load(open("mods/vexmap/compatibility.json"))["horizon_mixins_revision"])')
          git clone https://github.com/horizon-rust/horizon-mixins .deps/horizon-mixins
          git -C .deps/horizon-mixins checkout "$rev"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .deps/target
            .deps/horizon-mixins/target
          key: native-${{ hashFiles('mods/vexmap/compatibility.json') }}
      - run: python3 tools/dev/stage.py check mods/vexmap
