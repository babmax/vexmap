<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" role="img" aria-label="Архитектура VexMap: клиенты, прокси Velocity, серверы регионов, sidecar и база данных">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#8ea6cc"/>
    </marker>
  </defs>
  <rect width="1280" height="560" rx="18" fill="#0d1526"/>
  <g font-family="Segoe UI,Helvetica,Arial,sans-serif">
    <text x="48" y="58" font-size="26" font-weight="700" fill="#ffffff">Как устроен VexMap</text>
    <text x="48" y="86" font-size="15" fill="#9fb0cc">Игровой поток только обменивает буферы. Вся тяжёлая работа вне тика.</text>

    <g fill="#14233f" stroke="#2c4470" stroke-width="1.5">
      <rect x="48" y="150" width="210" height="270" rx="14"/>
      <rect x="318" y="210" width="150" height="150" rx="14"/>
      <rect x="528" y="130" width="280" height="130" rx="14"/>
      <rect x="528" y="310" width="280" height="130" rx="14"/>
      <rect x="908" y="190" width="324" height="190" rx="14"/>
      <rect x="908" y="430" width="324" height="84" rx="14"/>
      <rect x="908" y="112" width="324" height="50" rx="14"/>
    </g>

    <g fill="#ffffff" font-weight="700" font-size="18">
      <text x="72" y="186">Клиент Horizon</text>
      <text x="393" y="272" text-anchor="middle">Velocity</text>
      <text x="552" y="164">Сервер региона a</text>
      <text x="552" y="344">Сервер региона b</text>
      <text x="932" y="224">vexmap-sidecar</text>
      <text x="932" y="464">SQLite / PostgreSQL</text>
    </g>
    <g fill="#a9bbd8" font-size="14">
      <text x="72" y="222">мод vexmap</text>
      <text x="72" y="252">рукопожатие</text>
      <text x="72" y="276">таблица маркеров</text>
      <text x="72" y="300">ключ + дельты</text>
      <text x="72" y="388" fill="#6f83a5">карта появится</text>
      <text x="72" y="408" fill="#6f83a5">в Фазах 4–5</text>
      <text x="393" y="298" text-anchor="middle">прокси</text>
      <text x="552" y="194">тик: допуск, снимок 2 Гц</text>
      <text x="552" y="218">поток vexmap-feed</text>
      <text x="552" y="374">тик: допуск, снимок 2 Гц</text>
      <text x="552" y="398">поток vexmap-feed</text>
      <text x="932" y="254">ядро данных, права, журнал</text>
      <text x="932" y="280">таблица позиций в памяти</text>
      <text x="932" y="306">каналы стран и видимость</text>
      <text x="932" y="332">локальный REST API</text>
      <text x="932" y="492">игроки, роли, выключатели, журнал</text>
      <text x="932" y="142" font-size="15" fill="#dbe5f7">RP-моды: REST и крейт</text>
    </g>

    <g stroke="#8ea6cc" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)">
      <path d="M260 285H316"/>
      <path d="M470 262 526 210"/>
      <path d="M470 308 526 360"/>
      <path d="M810 200 906 250"/>
      <path d="M810 370 906 320"/>
      <path d="M1070 382V428"/>
      <path d="M1070 164V188"/>
    </g>
    <g fill="#8ea6cc" font-size="13">
      <text x="288" y="340" text-anchor="middle">plugin</text>
      <text x="288" y="358" text-anchor="middle">channel</text>
      <text x="858" y="282" text-anchor="middle">loopback TCP</text>
    </g>
  </g>
</svg>
