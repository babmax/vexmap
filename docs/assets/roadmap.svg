<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-label="Шестнадцать фаз разработки VexMap и их состояние">
  <rect width="1280" height="400" rx="18" fill="#0d1526"/>
  <g font-family="Segoe UI,Helvetica,Arial,sans-serif">
    <text x="48" y="58" font-size="26" font-weight="700" fill="#ffffff">Фазы разработки</text>
    <g font-size="14" fill="#dbe5f7">
      <rect x="800" y="44" width="16" height="16" rx="4" fill="#35d0a5"/><text x="824" y="57">готово</text>
      <rect x="896" y="44" width="16" height="16" rx="4" fill="#4f9dff"/><text x="920" y="57">основа готова</text>
      <rect x="1040" y="44" width="16" height="16" rx="4" fill="#ffb547"/><text x="1064" y="57">идёт</text>
      <rect x="1120" y="44" width="16" height="16" rx="4" fill="#2a3a59"/><text x="1144" y="57">впереди</text>
    </g>
    <g font-size="13.5" font-weight="600" text-anchor="middle" fill="#e8effb">
      <g>
        <rect x="48" y="96" width="136" height="112" rx="12" fill="#35d0a5"/><text x="116" y="136" font-size="26" font-weight="800" fill="#08201a">0</text><text x="116" y="162" fill="#08201a">Аудит и ADR</text>
        <rect x="196" y="96" width="136" height="112" rx="12" fill="#4f9dff"/><text x="264" y="136" font-size="26" font-weight="800" fill="#07192f">1</text><text x="264" y="162" fill="#07192f">Хуки и сборка</text>
        <rect x="344" y="96" width="136" height="112" rx="12" fill="#4f9dff"/><text x="412" y="136" font-size="26" font-weight="800" fill="#07192f">2</text><text x="412" y="162" fill="#07192f">Данные и API</text>
        <rect x="492" y="96" width="136" height="112" rx="12" fill="#4f9dff"/><text x="560" y="136" font-size="26" font-weight="800" fill="#07192f">3</text><text x="560" y="162" fill="#07192f">Realtime</text>
      </g>
      <g fill="#c8d4ea">
        <rect x="640" y="96" width="136" height="112" rx="12" fill="#ffb547"/><text x="708" y="136" font-size="26" font-weight="800" fill="#2b1c02">4</text><text x="708" y="162" fill="#2b1c02">Интеграция</text><text x="708" y="182" fill="#2b1c02">в игру</text>
        <rect x="788" y="96" width="136" height="112" rx="12" fill="#2a3a59"/><text x="856" y="136" font-size="26" font-weight="800">5</text><text x="856" y="162">Тайлы, глобус</text>
        <rect x="936" y="96" width="136" height="112" rx="12" fill="#2a3a59"/><text x="1004" y="136" font-size="26" font-weight="800">6</text><text x="1004" y="162">GPS, маршруты</text>
        <rect x="1084" y="96" width="148" height="112" rx="12" fill="#2a3a59"/><text x="1158" y="136" font-size="26" font-weight="800">7</text><text x="1158" y="162">Страны, вики</text>
        <rect x="48" y="226" width="136" height="112" rx="12" fill="#2a3a59"/><text x="116" y="266" font-size="26" font-weight="800">8</text><text x="116" y="292">Места, отзывы</text>
        <rect x="196" y="226" width="136" height="112" rx="12" fill="#2a3a59"/><text x="264" y="266" font-size="26" font-weight="800">9</text><text x="264" y="292">Панорамы, 3D</text>
        <rect x="344" y="226" width="136" height="112" rx="12" fill="#2a3a59"/><text x="412" y="266" font-size="26" font-weight="800">10</text><text x="412" y="292">Модерация</text>
        <rect x="492" y="226" width="136" height="112" rx="12" fill="#2a3a59"/><text x="560" y="266" font-size="26" font-weight="800">11</text><text x="560" y="292">Дипломатия, войны</text>
        <rect x="640" y="226" width="136" height="112" rx="12" fill="#2a3a59"/><text x="708" y="266" font-size="26" font-weight="800">12</text><text x="708" y="292">Экономика, RP</text>
        <rect x="788" y="226" width="136" height="112" rx="12" fill="#2a3a59"/><text x="856" y="266" font-size="26" font-weight="800">13</text><text x="856" y="292">История карты</text>
        <rect x="936" y="226" width="136" height="112" rx="12" fill="#2a3a59"/><text x="1004" y="266" font-size="26" font-weight="800">14</text><text x="1004" y="292">Нагрузка 5000+</text>
        <rect x="1084" y="226" width="148" height="112" rx="12" fill="#2a3a59"/><text x="1158" y="266" font-size="26" font-weight="800">15</text><text x="1158" y="292">Релиз</text>
