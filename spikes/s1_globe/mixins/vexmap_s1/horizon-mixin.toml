# Throwaway spike S1: a full-screen globe in a mod screen, drawn through `hand_drawn`. Press M in game. Not for release.
[mod]
id = "vexmap_s1"
version = "0.0.1"
priority = 100

[compatibility]
horizon_revision = "6560641ba51a452f6bc2407baa4eb1b3be517ca8"

