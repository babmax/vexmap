[workspace]
members = ["crates/vexmap-proto", "crates/vexmap-core", "crates/vexmap-sidecar"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
vexmap-core = { path = "crates/vexmap-core" }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["any", "migrate", "macros", "postgres", "runtime-tokio", "sqlite-bundled"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde"] }
# Tests only.
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
